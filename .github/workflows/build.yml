name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (commit, branch, or tag) to build
        required: true
        type: string
    outputs:
      pkg_version:
        description: Build version
        value: ${{ jobs.source.outputs.pkg_version }}

jobs:
  source:
    name: Create source package
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
    - name: Clone tree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: Apply upstream patch 1
      run: |
        curl -L https://github.com/xemu-project/xemu/commit/81b14b8456d9612c7f13b397bb3b26242d09490a.patch -o /tmp/fix1.patch
        git apply --3way /tmp/fix1.patch

    - name: Apply upstream patch 2
      run: |
        curl -L https://github.com/xemu-project/xemu/commit/eabf6db52c15e12cf856e768e02cbdb68435efd1.patch -o /tmp/fix2.patch
        git apply --3way /tmp/fix2.patch
    
    - name: Install dependencies
      run: sudo apt-get install meson
    - name: Determine release version
      id: version
      run: |
        if TAG=$(git describe --tags --match 'v[0-9]*' 2>/dev/null) &&
           [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+-g[0-9a-f]+)?$ ]]; then
          echo "pkg_version=${TAG#v}" >> $GITHUB_OUTPUT
        else
          BASE_VERSION=$(tr -d '\n' < XEMU_VERSION)
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid XEMU_VERSION: $BASE_VERSION" >&2
            exit 1
          }
          SHORT_HASH=$(git rev-parse --short=12 HEAD)
          echo "pkg_version=${BASE_VERSION}-0-g${SHORT_HASH}" >> $GITHUB_OUTPUT
        fi
    - name: Create source package
      id: package
      run: |
        pkg_name="xemu-${{ steps.version.outputs.pkg_version }}"
        tar_filename="${pkg_name}.tar"
        tar_prefix="./${pkg_name}/"
        ./scripts/archive-source.sh ${tar_filename} ${tar_prefix}

        echo -n ${{ github.sha }} > XEMU_COMMIT
        echo -n ${{ steps.version.outputs.pkg_version }} > XEMU_VERSION
        tar -r --file "${tar_filename}" --transform "s,^./,${tar_prefix}," ./XEMU_COMMIT ./XEMU_VERSION

        zstd "${tar_filename}"
        echo "pkg_filename=${tar_filename}.zst" >> $GITHUB_OUTPUT
    - name: Upload source package artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: src
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0

  linux:
    name: Linux
    needs: source
    uses: ./.github/workflows/build-linux.yml
    with:
      pkg_version: ${{ needs.source.outputs.pkg_version }}

  macos:
    name: macOS
    needs: source
    uses: ./.github/workflows/build-macos.yml
    with:
      pkg_version: ${{ needs.source.outputs.pkg_version }}

  windows:
    name: Windows
    needs: source
    uses: ./.github/workflows/build-windows.yml
    with:
      pkg_version: ${{ needs.source.outputs.pkg_version }}

  test:
    name: Unit tests
    needs: source
    uses: ./.github/workflows/build-tests.yml
